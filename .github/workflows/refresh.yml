name: refresh profile

on:
  schedule:
    - cron: "17 5 * * *" # 10:47 IST, daily
  # No `push` trigger on purpose: this job commits, and a push trigger
  # would run it again on its own commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate.py

      - name: Commit if anything changed
        run: |
          [ -z "$(git status --porcelain -- assets/*.svg)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/*.svg
          git commit -m "chain: new block"
          git push
